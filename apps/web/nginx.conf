server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed asset filenames, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Self-hosted fonts. Names are stable rather than hashed, so this is a month
    # rather than a year -- long enough that nobody refetches them across the
    # tournament, short enough that rebuilding a face is not a year-long lie.
    # Change a font and change its filename.
    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # index.html must never be cached, or a deploy leaves people on the old
    # bundle pointing at hashed files that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Client-side routing: every unknown path serves the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
