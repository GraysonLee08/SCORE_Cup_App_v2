# Local development stack. Production and staging use their own compose files.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scup
      POSTGRES_USER: scup
      POSTGRES_PASSWORD: scup_dev_password
    # Bound to localhost only. Never publish Postgres to 0.0.0.0 -- the
    # previous deployment exposed 5454 to the internet.
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - scup-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scup -d scup']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  scup-dev-data:
