# Staging vhost for scorescupchicago.games.
#
# Served at https://staging.scorescupchicago.games (TLS via certbot).
# Port 8181 is kept as a DNS-independent fallback, useful if a record is ever
# changed or removed.
#
# NOTE: certbot edits the installed copy of this file to add the TLS block.
# Re-copying this template over it removes HTTPS.
#
# Install:
#   cp nginx-staging.conf /etc/nginx/sites-available/scup-staging
#   ln -sf /etc/nginx/sites-available/scup-staging /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

upstream scup_staging_web {
    server 127.0.0.1:8081;
}

upstream scup_staging_api {
    server 127.0.0.1:8083;
}

# Reachable without DNS, so the test tournament is not blocked on a record.
server {
    listen 8181;
    server_name _;

    # Staging holds real names and phone numbers during a rehearsal, so keep
    # it out of search results.
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/snippets/scup-common.conf;
}

# Used once staging.scorescupchicago.games resolves here.
server {
    listen 80;
    server_name staging.scorescupchicago.games;

    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/snippets/scup-common.conf;
}
